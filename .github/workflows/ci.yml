name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate Linux baselines for review (does not verify them)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: if [ -f /.dockerenv ]; then apt-get update && apt-get install -y --no-install-recommends unzip; fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:unit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun run test:firebase
      - run: bun run build
  screenshots:
    name: screenshots (${{ matrix.id }})
    if: inputs.update_snapshots != true
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: four, grep: 'four friends', images: '[0-9][0-9][0-9]-action-*-linux.png', story: STORY-linux.md }
          - { id: two, grep: '2 friends', images: '[0-9][0-9][0-9]-2p-action-*-linux.png', story: TWO-PLAYERS-linux.md }
          - { id: three, grep: '3 friends', images: '[0-9][0-9][0-9]-3p-action-*-linux.png', story: THREE-PLAYERS-linux.md }
          - { id: animations, grep: 'shared animation lab', images: '[0-9][0-9][0-9]-motion-*-linux.png', story: ANIMATIONS-linux.md }
          - { id: settings, grep: 'personal table settings', images: '[0-9][0-9][0-9]-settings-*-linux.png', story: SETTINGS-linux.md }
          - { id: camera, grep: 'camera views', images: '[0-9][0-9][0-9]-camera-*-linux.png', story: CAMERA-linux.md }
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:824f1a789072e648c62541c2cfa4479c4061a290d5c27766d67dc1dcbc19b321
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: if [ -f /.dockerenv ]; then apt-get update && apt-get install -y --no-install-recommends unzip; fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e --grep "$STORY"
        env:
          STORY: ${{ matrix.grep }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.id }}
          path: |
            playwright-report/
            test-results/
  baseline-review:
    name: baseline review (${{ matrix.id }})
    if: inputs.update_snapshots == true
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: four, grep: 'four friends', images: '[0-9][0-9][0-9]-action-*-linux.png', story: STORY-linux.md }
          - { id: two, grep: '2 friends', images: '[0-9][0-9][0-9]-2p-action-*-linux.png', story: TWO-PLAYERS-linux.md }
          - { id: three, grep: '3 friends', images: '[0-9][0-9][0-9]-3p-action-*-linux.png', story: THREE-PLAYERS-linux.md }
          - { id: animations, grep: 'shared animation lab', images: '[0-9][0-9][0-9]-motion-*-linux.png', story: ANIMATIONS-linux.md }
          - { id: settings, grep: 'personal table settings', images: '[0-9][0-9][0-9]-settings-*-linux.png', story: SETTINGS-linux.md }
          - { id: camera, grep: 'camera views', images: '[0-9][0-9][0-9]-camera-*-linux.png', story: CAMERA-linux.md }
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:824f1a789072e648c62541c2cfa4479c4061a290d5c27766d67dc1dcbc19b321
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: if [ -f /.dockerenv ]; then apt-get update && apt-get install -y --no-install-recommends unzip; fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e:update --grep "$STORY"
        env:
          STORY: ${{ matrix.grep }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-baselines-for-review-${{ matrix.id }}
          path: |
            tests/e2e/screenshots/${{ matrix.images }}
            tests/e2e/${{ matrix.story }}
            playwright-report/
            test-results/

  deploy-preview:
    name: Deploy playable PR preview
    needs: verify
    if: inputs.update_snapshots != true && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish.yml
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
    secrets: inherit

  deploy:
    name: Deploy production
    needs: [verify, screenshots]
    if: inputs.update_snapshots != true && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit

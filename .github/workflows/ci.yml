name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate Linux baselines for review (does not verify them)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: if [ -f /.dockerenv ]; then apt-get update && apt-get install -y --no-install-recommends unzip; fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:unit
      - run: bun run build
  screenshots:
    if: inputs.update_snapshots != true
    needs: verify
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:824f1a789072e648c62541c2cfa4479c4061a290d5c27766d67dc1dcbc19b321
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: if [ -f /.dockerenv ]; then apt-get update && apt-get install -y --no-install-recommends unzip; fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
  baseline-review:
    if: inputs.update_snapshots == true
    needs: verify
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:824f1a789072e648c62541c2cfa4479c4061a290d5c27766d67dc1dcbc19b321
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: if [ -f /.dockerenv ]; then apt-get update && apt-get install -y --no-install-recommends unzip; fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e:update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-baselines-for-review
          path: |
            tests/e2e/screenshots/*-linux.png
            tests/e2e/STORY-linux.md
            playwright-report/
            test-results/
